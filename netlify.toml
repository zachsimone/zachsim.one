[build]
    command = "npm run build"
    publish = "_site"

[build.environment]
    NODE_VERSION = "22"

# Squarespace served the blog RSS feed on a query parameter; keep existing
# subscribers working.
[[redirects]]
    from = "/blog"
    to = "/blog/rss.xml"
    status = 301
    force = true
    query = { format = "rss" }

# Duplicate homepage that Squarespace kept in the sitemap.
[[redirects]]
    from = "/zachsimone-home-1"
    to = "/"
    status = 301

# Tag archives that exist in the Squarespace sitemap but contain no posts.
[[redirects]]
    from = "/blog/tag/design"
    to = "/blog"
    status = 301

[[redirects]]
    from = "/blog/tag/9to5mac"
    to = "/blog"
    status = 301

